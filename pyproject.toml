[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antworld-wm"
version = "0.1.0"
description = "Banc d'essai pédagogique : comparer des world models dans un monde de fourmilières généré"
requires-python = ">=3.11"
# Dépendances minimales de l'étape 0. Les autres arrivent avec leur étape (voir extras).
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "torch>=2.2",
    "numba>=0.60",   # noyau du simulateur (étape 1) : mesure NumPy pur dans docs/DECISIONS.md
]

[project.optional-dependencies]
env = ["gymnasium>=0.29"]                        # étape 2
rl = ["stable-baselines3>=2.3", "tensorboard"]   # étapes 4 et suivantes
viz = ["matplotlib", "pillow"]                   # rendu, GIF, courbes (pygame possible plus tard)
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
