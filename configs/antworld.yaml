# Monde de départ de l'étape 1 : grille 32x32, nourriture + minerai, brouillard dès le début.
# Seules les valeurs qui diffèrent des défauts de src/antworld/config.py sont nécessaires ;
# on les liste toutes ici pour que ce fichier serve de référence lisible.
world:
  size: 32
  rock_fraction: 0.16
  terrain_scale: 8.0
  food_fraction: 0.14
  food_cap_min: 8.0
  food_cap_max: 16.0
  food_regrow_rate: 0.01
  food_regrow_seed: 0.05
  ore_fraction: 0.04
  ore_min: 10.0
  ore_max: 25.0
colony:
  initial_ants: 12
  initial_food: 30.0
  eat_rate: 0.02
  carry_capacity: 2
  lay_rate: 0.25
  birth_cost: 4.0
  base_pop_cap: 40
  nursery_gain: 20
  base_food_storage: 60.0
  granary_gain: 60.0
sim:
  ticks_per_step: 5
  max_steps: 400
