# Monde de départ de l'étape 1 : grille 32x32, nourriture + minerai, brouillard dès le début.
# Seules les valeurs qui diffèrent des défauts de src/antworld/config.py sont nécessaires ;
# on les liste toutes ici pour que ce fichier serve de référence lisible.
world:
  size: 32
  rock_fraction: 0.16
  terrain_scale: 8.0
  food_fraction: 0.14
  food_cap_min: 8.0
  food_cap_max: 16.0
  food_regrow_rate: 0.01
  food_regrow_seed: 0.05
  ore_fraction: 0.02   # ~16 cases, ~196 de minerai par monde (il en faut 250 pour tout construire)
  ore_min: 8.0
  ore_max: 18.0
colony:
  initial_ants: 12
  initial_food: 30.0
  eat_rate: 0.02
  carry_capacity: 2
  lay_rate: 0.25
  birth_cost: 4.0
  base_pop_cap: 40
  nursery_gain: 20
  base_food_storage: 60.0
  granary_gain: 60.0
sim:
  ticks_per_step: 5
  max_steps: 400
reward:
  w_pop_level: 0.0025   # par fourmi et par pas : la prospérité compte tout au long de la partie
  w_food: 0.05
  w_ore: 0.05
  ore_surplus_penalty: 0.5   # minerai au-delà du « stock utile » : -0.5 * w_ore par unité
  w_survive: 0.1
obs:
  fog: true
